name: Build and LC parity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn -B clean verify
      - run: pip install -r scripts/parity-requirements.txt
      - run: python scripts/verify-parity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marc2bf-build-and-tests
          path: |
            target/marc2bf.jar
            target/surefire-reports/
            target/parity/
